AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SplitTrack Production-Grade Serverless Backend (API Gateway, Lambda, DynamoDB)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        DATA_TABLE: !Ref SplitTrackDataTable
        TRANSACTIONS_TABLE: !Ref SplitTrackTransactionsTable
        RECURRING_TABLE: !Ref SplitTrackRecurringTable
        TEMPLATES_TABLE: !Ref SplitTrackTemplatesTable
        LEDGER_DATA_TABLE: !Ref SplitTrackLedgerDataTable
        CHANGELOG_TABLE: !Ref SplitTrackChangelogTable
        API_KEY: '{{resolve:ssm:/splittrack/api-key}}'
        ADMIN_API_KEY: '{{resolve:ssm:/splittrack/admin-api-key}}'
        JWT_SECRET: '{{resolve:ssm:/splittrack/jwt-secret}}'
        CORS_ORIGIN: '*'

Resources:
  SplitTrackHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
          - x-user-id
          - x-api-key
          - x-admin-key
          - authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  SplitTrackDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrackData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE

  SplitTrackTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrackTransactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE

  SplitTrackRecurringTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrackRecurring
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: recurringId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: recurringId
          KeyType: RANGE

  SplitTrackTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrackTemplates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: templateId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: templateId
          KeyType: RANGE

  SplitTrackLedgerDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrackLedgerData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE

  SplitTrackChangelogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrackChangelog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: releaseId
          AttributeType: S
        - AttributeName: publishedAt
          AttributeType: S
      KeySchema:
        - AttributeName: releaseId
          KeyType: HASH
        - AttributeName: publishedAt
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackRecurringTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackLedgerDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackChangelogTable
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /api/{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /api
            Method: ANY
        RecurringProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /recurring/{proxy+}
            Method: ANY
        RecurringRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /recurring
            Method: ANY
        TemplatesProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /templates/{proxy+}
            Method: ANY
        TemplatesRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /templates
            Method: ANY
        AdminProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /admin/{proxy+}
            Method: ANY

  StateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/state.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackRecurringTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackLedgerDataTable
      Events:
        ReadState:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: GET
        SyncStatePut:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: PUT
        SyncStatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: POST
        DeleteState:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: DELETE
        EraseState:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state/erase
            Method: POST
        WriteEntity:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/entities/{entityType}/{entityId}'
            Method: PUT
        DeleteEntity:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/entities/{entityType}/{entityId}'
            Method: DELETE
        GetTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /transactions
            Method: GET
        GetTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/transactions/{transactionId}'
            Method: GET
        AddTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /transactions
            Method: POST
        BatchTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /transactions/batch
            Method: POST
        DeleteTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/transactions/{transactionId}'
            Method: DELETE

  ChangelogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/changelog.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackChangelogTable
      Events:
        ListChangelog:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /changelog
            Method: GET
        PublishChangelog:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /admin/changelog
            Method: POST

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /health
            Method: GET

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackDataTable
      Events:
        Signup:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/signup
            Method: POST
        Signin:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/signin
            Method: POST
        GoogleAuth:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/google
            Method: POST
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/me
            Method: GET

Outputs:
  ApiUrl:
    Description: SplitTrack HTTP API Gateway Base URL
    Value: !Sub 'https://${SplitTrackHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  DataTableName:
    Description: DynamoDB Data Table Name
    Value: !Ref SplitTrackDataTable
  TransactionsTableName:
    Description: DynamoDB Transactions Table Name
    Value: !Ref SplitTrackTransactionsTable
  RecurringTableName:
    Description: DynamoDB Recurring Table Name
    Value: !Ref SplitTrackRecurringTable
  TemplatesTableName:
    Description: DynamoDB Templates Table Name
    Value: !Ref SplitTrackTemplatesTable
  LedgerDataTableName:
    Description: DynamoDB Ledger Data Table Name
    Value: !Ref SplitTrackLedgerDataTable
  ChangelogTableName:
    Description: DynamoDB Changelog Table Name
    Value: !Ref SplitTrackChangelogTable
