AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  splittrack-backend

  Sample SAM Template for splittrack-backend

Globals:
  Function:
    Timeout: 3

Resources:
  # The Database (Always Free up to 25GB)
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SplitTrack_Transactions
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST # Best for Free Tier

  RepairLogicFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/
      Handler: repairLogic.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64

  # Updated Function with API Event
  UpdateTransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/
      Handler: updateTransaction.handler
      Runtime: nodejs18.x
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TransactionsTable }
      Events:
        UpdateApi:
          Type: Api
          Properties:
            Path: /update
            Method: post
