AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SplitTrack Firebase-authenticated Serverless Backend (API Gateway, Lambda, DynamoDB)

Parameters:
  FirebaseProjectId:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{4,50}'
    Description: Firebase project whose signed ID tokens authenticate existing Lambdas
  MediaBucketName:
    Type: String
    Default: splittrack-deployments-726016642280-ap-south-1
    Description: Existing private bucket; app media uses only its app-media prefix

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        DATA_TABLE: !Ref SplitTrackDataTable
        TRANSACTIONS_TABLE: !Ref SplitTrackTransactionsTable
        RECURRING_TABLE: !Ref SplitTrackRecurringTable
        TEMPLATES_TABLE: !Ref SplitTrackTemplatesTable
        LEDGER_DATA_TABLE: !Ref SplitTrackLedgerDataTable
        CHANGELOG_TABLE: !Ref SplitTrackChangelogTable
        FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
        MEDIA_BUCKET: !Ref MediaBucketName
        CORS_ORIGIN: '*'
        ADOPTION_TABLE: SplitTrackAppReleases

Resources:
  SplitTrackHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
          - x-admin-key
          - authorization
          - idempotency-key
          - x-app-version
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  SplitTrackDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      TableName: SplitTrackData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE

  SplitTrackTransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      TableName: SplitTrackTransactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE

  SplitTrackRecurringTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: SplitTrackRecurring
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: recurringId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: recurringId
          KeyType: RANGE

  SplitTrackTemplatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: SplitTrackTemplates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: templateId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: templateId
          KeyType: RANGE

  SplitTrackLedgerDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      TableName: SplitTrackLedgerData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledgerId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: ledgerId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE

  SplitTrackChangelogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: SplitTrackChangelog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: releaseId
          AttributeType: S
        - AttributeName: publishedAt
          AttributeType: S
      KeySchema:
        - AttributeName: releaseId
          KeyType: HASH
        - AttributeName: publishedAt
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: handlers/api.handler
      Environment:
        Variables:
          ADMIN_API_KEY: '{{resolve:ssm:/splittrack/admin-api-key}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackRecurringTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackLedgerDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackChangelogTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource:
                - !GetAtt SplitTrackDataTable.Arn
                - !GetAtt SplitTrackLedgerDataTable.Arn
                - !GetAtt SplitTrackTransactionsTable.Arn
                - !GetAtt SplitTrackRecurringTable.Arn
                - !GetAtt SplitTrackTemplatesTable.Arn
                - !GetAtt SplitTrackChangelogTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/app-media/*'
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /api/{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /api
            Method: ANY
        RecurringProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /recurring/{proxy+}
            Method: ANY
        RecurringRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /recurring
            Method: ANY
        TemplatesProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /templates/{proxy+}
            Method: ANY
        TemplatesRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /templates
            Method: ANY
        AdminProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /admin/{proxy+}
            Method: ANY

  StateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: handlers/state.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SplitTrackAppReleases'
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackRecurringTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackTemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackLedgerDataTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource:
                - !GetAtt SplitTrackDataTable.Arn
                - !GetAtt SplitTrackLedgerDataTable.Arn
                - !GetAtt SplitTrackTransactionsTable.Arn
                - !GetAtt SplitTrackRecurringTable.Arn
                - !GetAtt SplitTrackTemplatesTable.Arn
                - !GetAtt SplitTrackChangelogTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/app-media/*'
      Events:
        ReadState:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: GET
        SyncStatePut:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: PUT
        SyncStatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: POST
        DeleteState:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state
            Method: DELETE
        EraseState:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /state/erase
            Method: POST
        WriteEntity:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/entities/{entityType}/{entityId}'
            Method: PUT
        DeleteEntity:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/entities/{entityType}/{entityId}'
            Method: DELETE
        GetTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /transactions
            Method: GET
        GetTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/transactions/{transactionId}'
            Method: GET
        AddTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /transactions
            Method: POST
        BatchTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /transactions/batch
            Method: POST
        DeleteTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: '/transactions/{transactionId}'
            Method: DELETE

  ChangelogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: handlers/changelog.handler
      Environment:
        Variables:
          ADMIN_API_KEY: '{{resolve:ssm:/splittrack/admin-api-key}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackChangelogTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt SplitTrackChangelogTable.Arn
      Events:
        ListChangelog:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /changelog
            Method: GET
        PublishChangelog:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /admin/changelog
            Method: POST

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: handlers/health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /health
            Method: GET

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: handlers/auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SplitTrackLedgerDataTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource:
                - !GetAtt SplitTrackDataTable.Arn
                - !GetAtt SplitTrackLedgerDataTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/app-media/*'
      Events:
        Signup:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/signup
            Method: POST
        Signin:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/signin
            Method: POST
        GoogleAuth:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/google
            Method: POST
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref SplitTrackHttpApi
            Path: /auth/me
            Method: GET

Outputs:
  ApiUrl:
    Description: SplitTrack HTTP API Gateway Base URL
    Value: !Sub 'https://${SplitTrackHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  DataTableName:
    Description: DynamoDB Data Table Name
    Value: !Ref SplitTrackDataTable
  TransactionsTableName:
    Description: DynamoDB Transactions Table Name
    Value: !Ref SplitTrackTransactionsTable
  RecurringTableName:
    Description: DynamoDB Recurring Table Name
    Value: !Ref SplitTrackRecurringTable
  TemplatesTableName:
    Description: DynamoDB Templates Table Name
    Value: !Ref SplitTrackTemplatesTable
  LedgerDataTableName:
    Description: DynamoDB Ledger Data Table Name
    Value: !Ref SplitTrackLedgerDataTable
  ChangelogTableName:
    Description: DynamoDB Changelog Table Name
    Value: !Ref SplitTrackChangelogTable
